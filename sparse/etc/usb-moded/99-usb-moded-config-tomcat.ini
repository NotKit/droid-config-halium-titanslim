[configfs]
gadget_base_directory = /sys/kernel/config/usb_gadget/g1
function_rndis        = ncm.usb0
function_mtp          = ffs.mtp
gadget_conf_directory = configs/b.1
gadget_udc_device     = a600000.dwc3

[network]
interface = usb0

[udev]
charger_tracking = 1
extcon_tracking = 0
path = /sys/class/power_supply/ucsi-source-psy-soc:qcom,pmic_glink:qcom,ucsi1
